# Enterprise Sandboxed — автоматизация, CI/CD
# exec разрешён в sandbox, web_fetch только для внутренних доменов
# Для: CI/CD, интеграции, автоматизация

tools:
  profile: "deny-all"
  allow:
    - read
    - write
    - edit
    - exec
    - memory_search
    - memory_get
    - sessions_spawn
  deny:
    - web_search
    - browser
    - image_generate
  web_fetch:
    allowedDomains:
      - "internal.corp.local"
      - "gitlab.company.local"
      - "wiki.company.local"
  agents:
    defaults:
      sandbox:
        mode: "require"
        workspaceAccess: "workspace-only"
