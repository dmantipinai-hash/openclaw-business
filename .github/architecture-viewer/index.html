<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Architecture Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    header {
      padding: 16px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    #graph-container { flex: 1; overflow: auto; background: #f8f9fa; }
    .node rect { stroke-width: 2px; rx: 6; ry: 6; cursor: pointer; transition: filter 0.2s; }
    .node rect:hover { filter: brightness(0.9); }
    .node text { font-size: 12px; pointer-events: none; font-weight: 500; }
    .link { stroke-opacity: 0.6; }
    .link-label { font-size: 10px; fill: #555; pointer-events: none; }
    #tooltip {
      position: fixed;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      max-width: 300px;
      pointer-events: none;
      z-index: 1000;
      display: none;
      backdrop-filter: blur(8px);
    }
    #stats {
      position: fixed;
      top: 80px;
      right: 20px;
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      font-size: 12px;
      z-index: 100;
    }
    #stats h3 { margin-bottom: 12px; font-size: 14px; }
    #stats ul { list-style: none; }
    #stats li { margin-bottom: 4px; display: flex; justify-content: space-between; min-width: 180px; }
    #legend {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      font-size: 12px;
      z-index: 100;
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
    .legend-color { width: 12px; height: 12px; margin-right: 8px; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>OpenClaw Architecture Viewer</h1>
      <a href="../../../docs/architecture.md" style="color: white; text-decoration: none;">View Mermaid →</a>
    </header>
    <div id="graph-container"></div>
    <div id="tooltip"></div>
    <div id="stats"></div>
    <div id="legend"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
