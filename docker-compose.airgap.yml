# Enterprise Air-Gap Deployment — Docker Compose
# OpenClaw Gateway + Ollama LLM, полностью изолированная сеть
#
# Использование:
#   1. Скопировать .env.example в .env и заполнить плейсхолдеры
#   2. docker compose -f docker-compose.airgap.yml up -d
#   3. Проверить: docker compose -f docker-compose.airgap.yml ps

services:
  # ─── Ollama: внутренний LLM ────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-airgap
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - airgap-internal
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-8G}

  # ─── OpenClaw Gateway ──────────────────────────────────────────────
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-airgap
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy

    # ⚠️ ВАЖНО: порт НЕ публикуется наружу!
    # Доступ ТОЛЬКО через reverse proxy (nginx/Keycloak) на хосте.
    # Если нужен прямой доступ для теста — раскомментируй ports:
    # ports:
    #   - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"

    networks:
      - airgap-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      TZ: ${OPENCLAW_TZ:-Europe/Moscow}

      # ─── ФИЧА 7: Доверие к внутренним CA ──────────────────────
      NODE_EXTRA_CA_CERTS: /etc/openclaw/ca-certificates.pem

    volumes:
      # Конфиг OpenClaw (airgap-baseline.json5 → openclaw.json)
      - ./docs/enterprise/airgap-baseline.json5:/home/node/.openclaw/openclaw.json:ro
      # Workspace
      - openclaw-workspace:/home/node/.openclaw/workspace
      # CA сертификаты контура
      - ${CA_CERT_PATH:-./certs/ca-certificates.pem}:/etc/openclaw/ca-certificates.pem:ro
      # Логи
      - openclaw-logs:/var/log/openclaw

    # Security hardening
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Gateway bind на loopback внутри контейнера
    # Доступ через reverse proxy на хосте → docker network
    command:
      [
        "node", "dist/index.js", "gateway",
        "--bind", "lan",
        "--port", "18789",
      ]

networks:
  airgap-internal:
    driver: bridge
    internal: true  # ← КЛЮЧЕВОЕ: no external access
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ollama-data:
  openclaw-workspace:
  openclaw-logs:
